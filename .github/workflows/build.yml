name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  release-windows:
    name: Release x64 Windows
    # The image carries Visual Studio 2026, so the project's own v145 toolset and its
    # 10.0.26100.0 SDK are both present. No toolset override.
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild Sunrise.sln /m
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Release-x64
          path: |
            build/x64/Release/steam_api64.dll
            build/x64/Release/steam_api64.pdb
          if-no-files-found: error

  release-linux:
    name: Release x64 Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang ninja-build llvm cargo
          sudo ln -s $(which clang) /usr/bin/clang-cl
          sudo ln -s $(which lld-link) /usr/bin/lld-link

      - name: Install xwin
        run: cargo install xwin

      - name: Download Windows SDK
        run: xwin --sdk-version 10.0.26100  --accept-license splat --include-debug-libs --output .xwin-cache

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$(pwd)/linux-to-win-toolchain.cmake

      - name: Build
        run: cmake --build build
